name: UI/API Tests Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Позволяет запускать тесты кнопкой вручную

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # 1. Скачиваем наш код
      - uses: actions/checkout@v4

      # 2. Устанавливаем Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Запускаем тесты через Maven
      - name: Run tests
        continue-on-error: true # Не останавливаем пайплайн, если тесты упадут
        run: mvn clean test

      # 4. Генерируем Allure отчет
      - name: Generate Allure report
        run: mvn allure:report

      # 5. Сохраняем отчет как артефакт (чтобы его мог забрать следующий шаг)
      - name: Upload Allure report artifact
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
          retention-days: 20

  deploy-report:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Download Allure report
        uses: actions/download-artifact@v4
        with:
          name: allure-report
          path: _site

      # 6. Публикуем отчет в GitHub Pages!
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4